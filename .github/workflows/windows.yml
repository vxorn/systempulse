name: Windows tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SystemPulse
        run: python -m pip install .
      - name: Check installed command
        run: systempulse --help
      - name: Run tests
        run: python -m unittest discover -s tests -v

  portable:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install . 'pyinstaller>=6.12,<7'
      - name: Build and archive the portable app
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name SystemPulse packaging/windows_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path README.md,LICENSE -Destination dist/SystemPulse
          Compress-Archive -Path dist/SystemPulse -DestinationPath dist/SystemPulse-Windows-x64.zip
      - name: Test the executable from the extracted archive
        run: |
          Expand-Archive -Path dist/SystemPulse-Windows-x64.zip -DestinationPath portable-test
          $env:SYSTEMPULSE_TEST_EXECUTABLE = (Resolve-Path portable-test/SystemPulse/SystemPulse.exe).Path
          python -m unittest discover -s tests -p test_integration.py -v
      - uses: actions/upload-artifact@v6
        with:
          name: SystemPulse-Windows-x64
          path: dist/SystemPulse-Windows-x64.zip
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install . 'pyinstaller>=6.12,<7'
      - name: Build the Windows installer
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SystemPulse --distpath dist/desktop packaging/desktop_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/desktop/SystemPulse dist/SystemPulseDesktop
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = python -c "from importlib.metadata import version; print(version('systempulse'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "/DAppVersion=$version" packaging/windows_installer.iss
      - name: Install, launch, and uninstall the desktop app
        run: ./packaging/test_installer.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: SystemPulse-Setup-Windows-x64
          path: installer/SystemPulse-Setup-Windows-x64.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, portable, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: SystemPulse-Windows-x64
      - uses: actions/download-artifact@v6
        with:
          name: SystemPulse-Setup-Windows-x64
      - name: Draft the release with the tested builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum SystemPulse-Setup-Windows-x64.exe SystemPulse-Windows-x64.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" SystemPulse-Setup-Windows-x64.exe SystemPulse-Windows-x64.zip SHA256SUMS.txt \
            --verify-tag --draft --title "SystemPulse $GITHUB_REF_NAME"
